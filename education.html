<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Education — Dhananjay</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .wrap {
            max-width: 1120px;
            margin: auto;
            padding: 28px 22px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 22px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            background: rgba(13, 17, 23, .94);
            backdrop-filter: blur(12px);
            z-index: 5
        }

        .brand {
            font-weight: 800
        }

        .nav {
            display: flex;
            gap: 14px;
            flex-wrap: wrap
        }

        .nav a {
            color: #8b949e;
            font-size: 14px
        }

        .nav a:hover {
            color: #58a6ff
        }

        .hero {
            padding: 58px 0 35px
        }

        .eyebrow {
            color: #58a6ff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .12em
        }

        .hero h1 {
            font-size: clamp(34px, 6vw, 62px);
            line-height: 1.05;
            margin: 10px 0
        }

        .hero p {
            max-width: 760px;
            color: #8b949e;
            font-size: 18px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px
        }

        .card {
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 22px;
            background: #161b22
        }

        .card h2,
        .card h3 {
            margin-top: 0
        }

        .muted {
            color: #8b949e
        }

        .tag {
            display: inline-block;
            padding: 4px 9px;
            margin: 4px 4px 0 0;
            border: 1px solid #30363d;
            border-radius: 999px;
            color: #8b949e;
            font-size: 12px
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #30363d;
            border-radius: 9px;
            margin: 8px 8px 0 0;
            background: #21262d
        }

        .btn.primary {
            background: #238636;
            border-color: #238636;
            color: #fff
        }

        .section {
            margin: 20px 0 50px
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px
        }

        .fact {
            padding: 15px;
            border: 1px solid #30363d;
            border-radius: 10px
        }

        .fact b {
            display: block
        }

        .list {
            padding-left: 20px
        }

        .foot {
            border-top: 1px solid #30363d;
            color: #8b949e;
            padding: 25px 0;
            margin-top: 60px;
            font-size: 13px
        }

        @media(max-width:700px) {
            .top {
                align-items: flex-start;
                flex-direction: column
            }

            .nav {
                gap: 10px
            }

            .hero {
                padding-top: 35px
            }
        }
    </style>
</head>

<body>
    <header class="top"><a class="brand" href="index.html">Dhananjay</a>
        <nav class="nav"><a href="index.html">Home</a><a href="projects.html">Projects</a><a
                href="repositories.html">Repositories</a><a href="private-projects.html">Private Projects</a><a
                href="experience.html">Experience</a><a href="services.html">Services</a><a
                href="contact.html">Contact</a></nav>
    </header>
    <main class="wrap">
        <section class="hero"><span class="eyebrow">Academic Background</span>
            <h1>Education</h1>
            <p>Academic background listed in the portfolio.</p>
        </section>
        <section class="section">
            <div class="card">
                <h2>Education</h2>
                <div class="facts">
                    <div class="fact"><b>Bachelor of Computer Science</b><span>Completed</span></div>
                    <div class="fact"><b>Master of Computer Application</b><span>Current</span></div>
                </div>
            </div>
        </section>
        <footer class="foot">© 2026 Dhananjay Shirse · Maharashtra, India</footer>
    </main>
</body>

</html>

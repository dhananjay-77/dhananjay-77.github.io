<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Project Details | Dhananjay Shirse</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .wrap {
            max-width: 1120px;
            margin: auto;
            padding: 28px 22px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 22px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            background: rgba(13, 17, 23, .94);
            backdrop-filter: blur(12px);
            z-index: 5
        }

        .brand {
            font-weight: 800
        }

        .nav {
            display: flex;
            gap: 14px;
            flex-wrap: wrap
        }

        .nav a {
            color: #8b949e;
            font-size: 14px
        }

        .nav a:hover {
            color: #58a6ff
        }

        .hero {
            padding: 58px 0 35px
        }

        .eyebrow {
            color: #58a6ff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .12em
        }

        .hero h1 {
            font-size: clamp(34px, 6vw, 62px);
            line-height: 1.05;
            margin: 10px 0
        }

        .hero p {
            max-width: 760px;
            color: #8b949e;
            font-size: 18px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px
        }

        .card {
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 22px;
            background: #161b22
        }

        .card h2,
        .card h3 {
            margin-top: 0
        }

        .muted {
            color: #8b949e
        }

        .tag {
            display: inline-block;
            padding: 4px 9px;
            margin: 4px 4px 0 0;
            border: 1px solid #30363d;
            border-radius: 999px;
            color: #8b949e;
            font-size: 12px
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #30363d;
            border-radius: 9px;
            margin: 8px 8px 0 0;
            background: #21262d
        }

        .btn.primary {
            background: #238636;
            border-color: #238636;
            color: #fff
        }

        .section {
            margin: 20px 0 50px
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px
        }

        .fact {
            padding: 15px;
            border: 1px solid #30363d;
            border-radius: 10px
        }

        .fact b {
            display: block
        }

        .list {
            padding-left: 20px
        }

        .foot {
            border-top: 1px solid #30363d;
            color: #8b949e;
            padding: 25px 0;
            margin-top: 60px;
            font-size: 13px
        }

        @media(max-width:700px) {
            .top {
                align-items: flex-start;
                flex-direction: column
            }

            .nav {
                gap: 10px
            }

            .hero {
                padding-top: 35px
            }
        }
    </style>

<style id="portfolio-refresh">
:root{color-scheme:light;--p-bg:#f7f9fc;--p-surface:#fff;--p-text:#111827;--p-muted:#536579;--p-border:#dce4ee;--p-blue:#2563eb}
:root[data-theme="dark"]{color-scheme:dark;--p-bg:#0b1422;--p-surface:#111e30;--p-text:#edf3fa;--p-muted:#b2c0d0;--p-border:#293d57;--p-blue:#78a9ff}
*{box-sizing:border-box}body{background:var(--p-bg)!important;color:var(--p-text)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important;line-height:1.7!important}a{color:var(--p-blue)}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--p-blue);outline-offset:3px}.top{background:color-mix(in srgb,var(--p-bg) 94%,transparent)!important;border-color:var(--p-border)!important;backdrop-filter:blur(12px)}.nav a{padding:7px 9px;border-radius:8px}.wrap{max-width:1160px!important;padding-top:34px!important}.hero{padding-top:64px!important;padding-bottom:40px!important}.hero h1{letter-spacing:-.045em;font-weight:750}.hero p,.muted{color:var(--p-muted)!important}.card{background:var(--p-surface)!important;border-color:var(--p-border)!important;border-radius:16px!important;box-shadow:0 12px 34px rgba(11,31,58,.045)}.grid{gap:18px}.card h2,.card h3{line-height:1.3}.btn{border-radius:10px!important;transition:background .15s ease,border-color .15s ease,transform .15s ease}.btn:hover{transform:translateY(-1px)}.btn.primary{background:#174b89!important;border-color:#174b89!important}.tag{border-color:var(--p-border)!important;color:var(--p-muted)!important;background:var(--p-bg)}.fact{border-color:var(--p-border)!important}.foot{border-color:var(--p-border)!important;color:var(--p-muted)!important}.list li{margin:.35em 0}img{max-width:100%;height:auto} @media(max-width:700px){.wrap{padding:22px 16px!important}.hero{padding-top:38px!important}.grid,.facts{grid-template-columns:1fr!important}.top{padding:12px 16px!important}.nav{gap:6px}}
</style>

</head>

    <header class="top"><a class="brand" href="index.html">Dhananjay</a>
